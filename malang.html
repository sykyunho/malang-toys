<style>
/* Layout: one full-bleed play table. 위는 이름과 도구, 아래는 맛 고르기 위에 어두운 유리 탭바 하나 — 바탕은 맛 색 그대로 밝게 둔다.
   결: zinc 무채색 글자, 브랜드 핑크 강조, 노란 말풍선 배지, 둥근 유리 탭바. 이 장난감은 밝은 화면 하나로만 그린다. */
:root {
  color-scheme: light;
  --table: #f6c6d2;   /* page ground, follows the current flavor */
  --ink: #18181b;
  --ink-soft: #71717a;
  --ink-mute: #a1a1aa;
  --on-ink: #fafafa;
  --glass: rgba(255, 255, 255, 0.74);
  --glass-strong: rgba(255, 255, 255, 0.96);
  --line: rgba(24, 24, 27, 0.1);
  --night: rgba(18, 18, 18, 0.66);
  --night-line: rgba(244, 244, 245, 0.42);
  --brand: #ff1f66;
  --badge: #fbb717;
  --accent: #d9587c;  /* follows the current flavor (공 고르기 동그라미에만) */
  --display: "Song Myung", "AppleMyungjo", "Nanum Myeongjo", serif;
  --body: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--table);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; outline: none; }

.top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.55rem; letter-spacing: -0.02em; color: var(--ink); }
.tools { display: flex; gap: 6px; }
.pill {
  font: inherit; font-size: 0.8125rem; font-weight: 600; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 12px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.pill[aria-pressed="false"] { color: var(--ink-soft); }
#fixBtn[aria-pressed="true"] { color: var(--brand); border-color: var(--brand); background: var(--glass-strong); }
.pill:active, .chip:active, .tab:active, .seg button:active { transform: scale(0.96); }
.pill:focus-visible, .tab:focus-visible, .chip:focus-visible, .seg button:focus-visible, #gl:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* 상태 한 줄: 칩처럼 어두운 유리 */
.status {
  position: absolute; left: 50%; top: 60px; transform: translateX(-50%); z-index: 2;
  font-size: 0.8125rem; font-weight: 600; color: var(--on-ink);
  background: var(--night); border: 1px solid var(--night-line); border-radius: 999px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  padding: 6px 14px; width: max-content; max-width: calc(100% - 32px); text-align: center; font-variant-numeric: tabular-nums; pointer-events: none;
}
.fallback {
  position: absolute; left: 0; right: 0; top: 40%; z-index: 3; text-align: center; font-size: 1rem; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 0 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.hint {
  margin: 0; text-align: center; font-size: 0.8125rem; font-weight: 500; color: var(--ink-soft);
  text-wrap: balance; transition: opacity 0.6s ease; pointer-events: none;
}
.hint.gone { opacity: 0; }

/* 맛 고르기: 흰 유리 칩, 고른 칩은 브랜드 핑크 테 */
.flavors {
  display: flex; gap: 8px; max-width: 100%; overflow-x: auto; padding: 2px 2px 4px;
  scrollbar-width: none; touch-action: pan-x;
}
.flavors::-webkit-scrollbar { display: none; }
.flavors > :first-child { margin-left: auto; }
.flavors > :last-child { margin-right: auto; }
.chip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
  font: inherit; font-size: 0.875rem; font-weight: 600; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 13px 5px 5px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.chip[aria-pressed="true"] { background: var(--glass-strong); border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.swatch { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset -3px -4px 6px rgba(0, 0, 0, 0.14), inset 3px 3px 5px rgba(255, 255, 255, 0.55); }

.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; }
.seg[hidden] { display: none; }
.seg button {
  font: inherit; font-size: 0.8125rem; font-weight: 600; color: var(--ink-soft);
  background: transparent; border: 0; border-radius: 999px; padding: 5px 16px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

/* 종류 탭: 아래 탭바처럼 둥근 어두운 유리. 고른 탭은 아이콘이 핑크로 */
.tabs {
  display: flex; width: min(100%, 408px); padding: 7px; gap: 2px;
  background: var(--night); border: 1px solid var(--night-line); border-radius: 32px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);

.tab {
  position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font: inherit; font-size: 0.75rem; font-weight: 600; color: var(--ink-mute);
  background: transparent; border: 0; border-radius: 24px; padding: 7px 4px 6px; cursor: pointer;

.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--on-ink); background: rgba(255, 255, 255, 0.1); }
.tab[aria-selected="true"] svg { stroke: var(--brand); }
.badge {
  position: absolute; bottom: calc(100% - 3px); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; pointer-events: none;
}
.badge b { background: var(--badge); color: #fff; font-size: 0.6875rem; line-height: 1; font-weight: 700; border-radius: 999px; padding: 4px 7px; white-space: nowrap; }
.badge i { width: 0; height: 0; margin-top: -1px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid var(--badge); }
@media (max-width: 380px) { h1 { font-size: 1.35rem; } .pill { padding: 6px 9px; font-size: 0.75rem; } .tab { font-size: 0.6875rem; } }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }

      float rimness = smoothstep(0.45, 1.0, length(d.xy));
      edgePush += max(d.z, 0.0) * exp(-rr / (d.w * d.w * 2.5)) * rimness;
    }
  }
  return s;
}
float surf(vec2 q, out float inside, out float ds, out vec2 p, out float R) {
  float ep;
  ds = dentField(q, ep);
  p = uShapeInv * q;
  R = 1.0 + uBulge - 0.6 * ep;
  inside = 1.0 - dot(p, p) / (R * R);
  float hgt = sqrt(max(inside, 0.0)) * R;
  if (uForm > 0.5) {
    // 모양 있는 말랑이: 가장자리에서 둥글게 부풀어 오른 쿠션 (공일 때와 같은 단면)
    float part;
    float sd = formSD(p / R, part);
    inside = -2.0 * sd;
    float k = clamp(-sd / 0.42, 0.0, 1.0);
    hgt = sqrt(max(1.0 - (1.0 - k) * (1.0 - k), 0.0)) * 0.9 * R;
  }
  if (uPermN > 0.0) {
    vec2 pu = p / R;
    ds += permField(uRot * vec3(pu, sqrt(max(1.0 - dot(pu, pu), 0.0))));
  }
  return hgt - ds;
}
vec3 shadeSoft(vec3 n, vec3 alb, float dentAmt) {
  vec3 L = normalize(LIGHT);
  float ndl = dot(n, L);
  float wrap = clamp((ndl + 0.55) / 1.55, 0.0, 1.0);
  float rim = 1.0 - clamp(n.z, 0.0, 1.0);
  vec3 a = mix(alb, uDeep, clamp(dentAmt * 0.7 + uThin * 0.5, 0.0, 0.85));
  // 그늘은 회색이 아니라 맛 색깔로 진해진다
  vec3 dark = mix(a, uDeep, 0.45) * 0.7;
  vec3 col = mix(dark, a * 1.06, wrap);
  // 빛이 몸통을 지나 반대편으로 비쳐 나온다 (젤리일수록 강하게)
  float back = pow(clamp(0.5 - 0.5 * ndl, 0.0, 1.0), 1.5) * (1.0 - pow(rim, 3.0));
  col += mix(uCream, vec3(1.0), 0.25) * uTrans * back * 0.5;
  col += uDeep * uTrans * (0.25 * pow(rim, 1.6) + 0.2 * dentAmt);
  // 두꺼운 젤리 가장자리는 빛을 더 먹어서 진하다
  col *= 1.0 - uTrans * 0.3 * pow(rim, 1.5);
  col *= 1.0 - 0.2 * dentAmt * (1.0 - wrap);
  col += vec3(uSheen * 0.16 * pow(rim, 2.4));
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, H), 0.0), mix(16.0, 160.0, uGloss)) * mix(0.08, 0.9, uGloss);
  vec3 Rv = reflect(vec3(0.0, 0.0, -1.0), n);
  float box = smoothstep(0.90, 0.97, dot(Rv, normalize(BOXDIR))) * uGloss * 0.55;
  col += vec3(spec + box + pow(rim, 4.0) * 0.16);
  return col;
}
// ---------- 던지기: 밝은 원목 벽에 철퍽 붙은 말랑이들 ----------
// uSp: 화면 위치 x·y, 반지름, 퍼짐(0 동그란 공 ~ 1 납작) · uSq: 무늬 씨앗, 돌림, 종류, 보임 · uSr: 날아오는 중(1 손 가까이 ~ 0 벽)
// 원목 면이 화면 위로 갈수록 멀어진다 (사진처럼 비스듬히). 화면 점 → 면 위의 자리. 자바스크립트 planeOf 와 같은 식
const float TH_T = 0.22;
const float TH_FV = 1.5;
vec2 thPlane(vec2 lc) {
  float w = 1.0 / (1.0 - TH_T * lc.y);
  return vec2(lc.x * w, lc.y * w * TH_FV);
}
// 판자는 멀어지는 쪽으로 길게 깔려서 위로 갈수록 줄이 모이고, 결은 촘촘해지다 흐려진다
vec3 woodPlane(vec2 P, float w, vec2 fc) {
  vec2 p = P * 0.55;
  float plank = floor(p.x * 2.6);
  float wv = fbm(vec3(p.x * 20.0, p.y * 1.2, plank * 7.3));
  float ring = 0.5 + 0.5 * sin(p.x * 70.0 + wv * 8.0 + plank * 3.0);
  float fade = 1.0 / (1.0 + 0.8 * max(w - 1.0, 0.0));
  vec3 col = mix(vec3(0.93, 0.79, 0.58), vec3(0.82, 0.62, 0.40), clamp(smoothstep(0.35, 1.0, ring) * 0.55 * fade + (wv - 0.5) * 0.4, 0.0, 1.0));
  col *= 1.0 - 0.2 * smoothstep(0.47, 0.5, abs(fract(p.x * 2.6) - 0.5));   // 판자 이음매
  col = mix(col, vec3(0.97, 0.92, 0.85), clamp((w - 1.0) * 0.2, 0.0, 0.35));   // 먼 쪽은 살짝 뿌옇게
  vec2 g = (fc / uRes - vec2(0.15, 0.3)) * vec2(1.6, 2.2);
  col += vec3(0.08) * exp(-dot(g, g) * 2.0);   // 창빛
  return col;
}
// 납작하게 퍼질수록 가장자리가 울퉁불퉁 갈라져 나간다
float splatSD(vec2 q, vec4 a, vec4 b, out vec2 lv) {
  vec2 v = q - a.xy;
  float cr = cos(b.y);
  float sr = sin(b.y);
  lv = vec2(cr * v.x - sr * v.y, sr * v.x + cr * v.y);
  float ang = atan(lv.y, lv.x);
  float s = b.x * 17.0;
  // 한쪽으로 길쭉하게 + 크고 작은 혹이 고르지 않게 (별꽃처럼 반듯하지 않게)
  float wob = 0.35 * sin(2.0 * ang + s) + 0.4 * sin(3.0 * ang + s * 1.7) + 0.22 * sin(5.0 * ang + s * 2.9) + 0.14 * sin(8.0 * ang + s * 2.3) + 0.07 * sin(13.0 * ang + s * 3.1);
  float rr = a.z * (1.0 + a.w * 1.1) * (1.0 + a.w * 0.16 * wob);
  return length(v) - rr;
}
// 날아오는 공을 세로로 눌러 본다: 닿기 직전 면에 눕는 모양으로 이어지게
vec2 flyQ(vec2 p, vec4 a, float sq) {
  return a.xy + vec2(p.x - a.x, (p.y - a.y) * sq);
}
float splatH(vec2 q, vec4 a, vec4 b) {
  vec2 lv;
  float sd = splatSD(q, a, b, lv);
  float rr = a.z * (1.0 + a.w * 1.1);
  float w = clamp(a.w, 0.0, 1.0);
  float k = clamp(-sd / (rr * mix(0.7, 0.22, w)), 0.0, 1.0);   // 납작해질수록 가장자리만 짧게 둥글고 가운데는 판판하다
  float tack = (vnoise(vec3(lv / a.z * 4.0, b.x * 9.0)) - 0.5) * 0.03 * a.z * w * k;   // 끈적한 막의 잔주름
  return sqrt(max(1.0 - (1.0 - k) * (1.0 - k), 0.0)) * rr * mix(0.95, 0.045, w) + tack;
}
vec4 throw3(vec2 lc, vec2 fc) {
  float pw = 1.0 / (1.0 - TH_T * lc.y);
  vec2 P = thPlane(lc);
  vec3 col = woodPlane(P, pw, fc);
  float onPlane = 0.0;
  float tsq = 1.0;
  float top = -1.0;
  vec4 ta = vec4(0.0);
  vec4 tb = vec4(0.0);
  float tsd = 9.0;
  vec2 tlv = vec2(0.0);
  float shade = 0.0;
  float contact = 0.0;
  for (int i = 0; i < 14; i++) {
    if (float(i) >= uSpN) break;
    vec4 a = uSp[i];
    vec4 b = uSq[i];
    float air = uSr[i].x;
    // 날아오는 중엔 화면에서 동그란 공으로, 붙은 뒤엔 원목 면 위에서 잰다
    float onP = air > 0.0001 ? 0.0 : 1.0;   // flat 은 GLSL 예약어라 못 쓴다
    float sq = max(uSr[i].y, 1.0);
    vec2 q = onP > 0.5 ? P : flyQ(lc, a, sq);
    float px = onP > 0.5 ? pw * TH_FV / uRadius : 1.0 / uRadius;   // 한 픽셀이 그 자리에서 얼마인지
    float bound = a.z * (1.0 + a.w * 1.6) + 0.3 + air * 0.9;
    vec2 d = q - a.xy;
    if (dot(d, d) > bound * bound) continue;
    // 그림자: 면에서 떨어져 있을수록 멀리·흐리게
    vec2 lv;
    float sds = splatSD((onP > 0.5 ? P : flyQ(lc, a, sq)) - vec2(0.05, -0.07) * (0.25 + air * 5.0), a, b, lv);
    shade = max(shade, b.w * (1.0 - smoothstep(-0.02, 0.03 + air * 0.38, sds)) * (1.0 - air * 0.5));
    float sd = splatSD(q, a, b, lv);
    contact = max(contact, b.w * (1.0 - air) * (1.0 - smoothstep(0.0, 0.03, sd)));
    if (sd < 1.5 * px) { top = float(i); ta = a; tb = b; tsd = sd / px; tlv = lv; onPlane = onP; tsq = sq; }
  }
  col *= (1.0 - 0.28 * shade) * (1.0 - 0.3 * contact);
  if (top < 0.0) return vec4(col, 1.0);
  float e = 1.25 / uRadius;
  vec2 ex = vec2(e, 0.0);
  vec2 ey = vec2(0.0, e);
  float hx = onPlane > 0.5 ? splatH(thPlane(lc + ex), ta, tb) - splatH(thPlane(lc - ex), ta, tb) : splatH(flyQ(lc + ex, ta, tsq), ta, tb) - splatH(flyQ(lc - ex, ta, tsq), ta, tb);
  float hy = onPlane > 0.5 ? splatH(thPlane(lc + ey), ta, tb) - splatH(thPlane(lc - ey), ta, tb) : splatH(flyQ(lc + ey, ta, tsq), ta, tb) - splatH(flyQ(lc - ey, ta, tsq), ta, tb);
  vec3 n = normalize(vec3(-hx / (2.0 * e), -hy / (2.0 * e), 1.0));
  float rr = ta.z * (1.0 + ta.w * 1.1);
  float thick = clamp(-tsd * (onPlane > 0.5 ? pw * TH_FV : 1.0) / uRadius / (rr * 0.7), 0.0, 1.0);
  vec3 body = vec3(0.90, 0.17, 0.13);
  vec3 deep = vec3(0.58, 0.05, 0.07);
  if (tb.z > 0.5 && tb.z < 1.5) { body = vec3(0.98, 0.58, 0.10); deep = vec3(0.78, 0.30, 0.03); }
  else if (tb.z > 1.5 && tb.z < 2.5) { body = vec3(0.92, 0.12, 0.24); deep = vec3(0.60, 0.03, 0.12); }
  else if (tb.z > 2.5) { body = vec3(1.0, 0.62, 0.14); deep = vec3(0.86, 0.40, 0.03); }
  vec3 L = normalize(LIGHT);
  float wrap = clamp((dot(n, L) + 0.5) / 1.5, 0.0, 1.0);
  vec3 alb = mix(deep, body, wrap);
  alb += body * 0.25 * (1.0 - thick);   // 얇게 퍼진 가장자리는 빛이 비쳐 밝다
  vec2 lvn = tlv / ta.z;
  float ang = atan(tlv.y, tlv.x);
  if (tb.z < 2.5) {
    if (tb.z > 1.5) {   // 딸기 씨
      vec2 g = lvn * 6.0;
      vec2 f = fract(g) - 0.5 + (vec2(hash13(vec3(floor(g), 3.0)), hash13(vec3(floor(g), 7.0))) - 0.5) * 0.3;
      alb = mix(alb, vec3(1.0, 0.88, 0.45) * (0.7 + 0.4 * wrap), (1.0 - smoothstep(0.09, 0.13, length(f))) * 0.9);
    }
    // 꼭지: 가운데 초록 별
    float star = 0.5 * (0.3 + 0.7 * pow(abs(cos(2.5 * ang + tb.x * 9.0)), 2.2));   // 사진처럼 큼직한 꼭지
    float calyx = 1.0 - smoothstep(star - 0.03, star + 0.01, length(lvn));
    alb = mix(alb, vec3(0.16, 0.55, 0.24) * (0.6 + 0.55 * wrap), calyx);
  } else {
    alb *= 0.93 + 0.07 * vnoise(vec3(lvn * 14.0, 2.0));   // 귤 껍질 오톨도톨
    alb = mix(alb, vec3(0.3, 0.55, 0.2) * (0.6 + 0.5 * wrap), 1.0 - smoothstep(0.07, 0.1, length(lvn)));
  }
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, H), 0.0), 80.0) * 0.8;
  float box = smoothstep(0.9, 0.97, dot(reflect(vec3(0.0, 0.0, -1.0), n), normalize(BOXDIR))) * 0.45;
  vec3 sc = alb * (0.9 + 0.15 * thick) + vec3(spec + box);
  float alpha = clamp(-tsd + 0.5, 0.0, 1.0) * tb.w;   // tsd 는 픽셀 단위
  return vec4(mix(col, sc, alpha), 1.0);
}
// ---------- 키캡: 3×3 키패드를 위에서 비스듬히 내려다본다 (자바스크립트 KC 와 같은 카메라) ----------
const vec3 KC_T = vec3(0.0, -0.05, 0.12);
const float KC_EL = 0.95;
const float KC_DIST = 9.0;
const float KC_F = 5.6;
float sdRBox(vec3 p, vec3 b, float r) {
  vec3 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}
vec4 keyAt(float idx) {
  vec4 k = vec4(0.0);
  for (int i = 0; i < 9; i++) { if (float(i) == idx) k = uKey[i]; }
  return k;
}
// 키 하나 (바닥 y=0 기준): 아래가 넓고 위로 좁아지는 둥근 상자, 윗면은 오목하게 파였다. 누르면 0.16 내려간다
float sdKey(vec3 p, float press) {
  p.y += press * 0.16;
  float t = clamp(p.y / 0.34, 0.0, 1.0);
  float sc = 1.0 - 0.16 * t;
  vec3 q = p - vec3(0.0, 0.17, 0.0);
  q.xz /= sc;
  float d = sdRBox(q, vec3(0.42, 0.17, 0.42), 0.09) * sc;
  float dish = length(p - vec3(0.0, 0.34 + 1.6 - 0.035, 0.0)) - 1.6;
  return max(d, -dish);
}
// 가까운 칸의 키 하나 + 케이스(가운데가 우묵하게 파인 둥근 상자). mat 1 키 · 0 케이스
float keysScene(vec3 p, out float mat, out float kid) {
  vec2 cell = clamp(floor(p.xz + 0.5), -1.0, 1.0);
  kid = (cell.y + 1.0) * 3.0 + (cell.x + 1.0);
  float dk = sdKey(p - vec3(cell.x, 0.0, cell.y), keyAt(kid).x);
  float dc = max(sdRBox(p - vec3(0.0, -0.2, 0.0), vec3(1.7, 0.28, 1.7), 0.18), -sdRBox(p - vec3(0.0, 0.15, 0.0), vec3(1.56, 0.37, 1.56), 0.06));
  mat = dk < dc ? 1.0 : 0.0;
  return min(dk, dc);
}
vec4 keys3(vec2 lc, vec3 bg) {
  vec3 ro = KC_T + vec3(0.0, sin(KC_EL), cos(KC_EL)) * KC_DIST;
  vec3 fw = normalize(KC_T - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw * KC_F + rt * lc.x + up * lc.y);
  // 키패드를 감싸는 상자 안에서만 시선을 따라간다
  vec3 ta = (vec3(-1.95, -0.52, -1.95) - ro) / rd;
  vec3 tb = (vec3(1.95, 0.6, 1.95) - ro) / rd;
  vec3 tlo = min(ta, tb);
  vec3 thi = max(ta, tb);
  float tn = max(max(tlo.x, tlo.y), tlo.z);
  float tf = min(min(thi.x, thi.y), thi.z);
  if (tn > tf || tf < 0.0) return vec4(bg, 1.0);
  float t = max(tn, 0.0);
  float mat; float kid;
  float minD = 9.0;
  float tMin = t;
  for (int i = 0; i < 90; i++) {
    vec3 q = ro + rd * t;
    float d = keysScene(q, mat, kid);
    if (d < minD) { minD = d; tMin = t; }
    if (d < 0.0008 || t > tf) break;
    // 칸 경계를 넘을 때는 옆 키를 못 보니 경계까지만 간다
    vec2 cell = clamp(floor(q.xz + 0.5), -1.0, 1.0);
    vec2 fr = abs(q.xz - cell);
    float border = 0.5 - max(fr.x, fr.y);
    t += (border > 0.0 ? min(d, border + 0.02) : d) * 0.9;
  }
  // 맞힌 픽셀은 꽉 차게, 스친 픽셀만 가장자리로 흐리게 (화면 한 픽셀이 장면에서 얼마인지로)
  float alpha = minD < 0.0008 ? 1.0 : clamp(1.0 - minD * uRadius * KC_F / KC_DIST, 0.0, 1.0);
  if (alpha <= 0.0) return vec4(bg, 1.0);
  // 맞힌 자리를 표면 위로 정확히 끌어온다 (안 하면 키 윗면에 물결 줄이 진다)
  if (minD < 0.0008) {
    for (int i = 0; i < 4; i++) tMin += keysScene(ro + rd * tMin, mat, kid);
  }
  vec3 p = ro + rd * tMin;
  float d0 = keysScene(p, mat, kid);
  float m2; float k2;
  vec3 e = vec3(0.002, 0.0, 0.0);
  vec3 n = normalize(vec3(
    keysScene(p + e.xyy, m2, k2) - keysScene(p - e.xyy, m2, k2),
    keysScene(p + e.yxy, m2, k2) - keysScene(p - e.yxy, m2, k2),
    keysScene(p + e.yyx, m2, k2) - keysScene(p - e.yyx, m2, k2)));
  vec4 k = keyAt(kid);
  vec2 cell = clamp(floor(p.xz + 0.5), -1.0, 1.0);
  vec3 alb;
  vec3 glow = vec3(0.0);
  if (mat > 0.5) {
    alb = abs(kid - 4.0) < 0.5 ? uCapB : uCapA;
    float ly = p.y + k.x * 0.16;
    alb *= mix(0.86, 1.04, smoothstep(0.22, 0.33, ly));   // 윗면은 밝게, 옆면은 조금 어둡게
    glow = uLed * k.y * 0.55 * (1.0 - smoothstep(0.0, 0.14, ly));   // 아래 테두리로 새는 불빛
  } else {
    alb = uCase;
    float floorish = 1.0 - smoothstep(-0.2, -0.12, p.y);
    alb = mix(alb, alb * 0.55, floorish);
    // 바닥 판: 누른 키 둘레로 불빛이 번진다
    vec2 dq = max(abs(p.xz - cell) - 0.42, 0.0);
    glow = uLed * k.y * 1.1 * exp(-length(dq) * 14.0) * floorish;
  }
  vec3 L = normalize(vec3(-0.4, 0.9, 0.5));
  float diff = max(dot(n, L), 0.0);
  float ao = clamp(keysScene(p + n * 0.06, m2, k2) / 0.06, 0.35, 1.0);
  float spec = pow(max(dot(reflect(-L, n), -rd), 0.0), 36.0) * 0.22;
  vec3 col = alb * (0.42 + 0.22 * n.y + 0.62 * diff) * ao + vec3(spec) + glow;
  return vec4(mix(bg, col, alpha), 1.0);
}
// 입체 오행 장면: 화면 점 → (늘림·부풂 되돌리고) 공 좌표로 돌려 모양까지 거리 + 손가락 자국만큼 안으로
float scene3(vec3 sp, out float part, out float dsum, out vec3 o) {
  float k = 1.0 + uBulge;
  o = uRot * vec3(uShapeInv * sp.xy / k, sp.z / k);
  float d = formSD3(o, part) * k;
  float ep;
  // 누르고 있는 자국은 화면 쪽 앞면만 화면 안쪽으로 밀린다 (얇은 데가 뚫리지 않게 조금 얕게)
  dsum = dentField(sp.xy, ep) * 0.7 * smoothstep(-0.25, 0.15, sp.z);
  if (uPermN > 0.0) dsum += permField3(o);
  return d + dsum;
}
vec4 solid3(vec2 lc, vec3 bg) {
  // 화면 앞(z 1.25)에서 안쪽으로 시선을 쏴서 표면을 찾는다. 못 맞히면 가장 가까이 스친 점으로 가장자리를 부드럽게
  float t = 1.25;
  float minD = 9.0;
  float tMin = t;
  float part; float dsum; vec3 o;
  for (int i = 0; i < 80; i++) {
    float d = scene3(vec3(lc, t), part, dsum, o);
    if (d < minD) { minD = d; tMin = t; }
    if (d < 0.0004 || t < -1.25) break;

      return;
    }
    pt.speed += (Math.hypot(dx, dy) / dts - pt.speed) * 0.5;
    if (pt.dent) { pt.dent.tx = x; pt.dent.ty = y; }
    if (stretch.active) return;
    if (pt.mat && pt.mat.kind === 'soft') {
      if (pt.moved > 10 && (!formOf() || is3D())) { const R = ball.R * 2.2; rotO(dy / R, dx / R, 0, Math.hypot(dx, dy) / R); }
    } else if (pt.wax) waxMove(pt);
  }
  function pressEnd(id) {
    const pt = pointers.get(id);
    if (!pt) return;
    pointers.delete(id);
    forceDraw = true;
    if (pt.kind === 'key') { if (pt.key >= 0) keyUp(pt.key); return; }
    if (stretch.active && (stretch.a === id || stretch.b === id)) stretch.active = false;
    if (pt.kind === 'spin') { spin.hold = [...pointers.values()].some((p) => p.kind === 'spin'); return; }
    const d = pt.dent;
    if (d) { d.active = false; d.rel = 0; }
    const held = (performance.now() - pt.t0) / 1000;
    if (pt.mat && pt.mat.kind === 'soft') {
      const ratio = d ? clamp(d.depth / Math.max(d.max, 0.01), 0, 1) : 0.5;
      releaseSound(pt.mat.sound, ratio);
      if (d && fixOn && d.depth > 0.02) bakeDent(d);
      if (held < 0.22 && pt.moved < 14) {
        const f = pt.mat.feel;
        if (f.type === 'foam') { shape.flatT = Math.min(0.3, shape.flatT + 0.06); shape.vf += 1.1; } else shape.vf += 2.6;
      }
    }
    pt.wax = null;
  }

  const localXY = (e) => { const r = glc.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  glc.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    Sound.unlock();
    try { glc.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 실패해도 이벤트는 온다 */ }
    const [x, y] = localXY(e);
    pressStart(e.pointerId, x, y);
  });
  glc.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const [x, y] = localXY(e);
    pressMove(e.pointerId, x, y);
  });
  const endEv = (e) => { Sound.unlock(); pressEnd(e.pointerId); };
  glc.addEventListener('pointerup', endEv);
  glc.addEventListener('pointercancel', (e) => pressEnd(e.pointerId));
  glc.addEventListener('lostpointercapture', (e) => pressEnd(e.pointerId));
  glc.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  glc.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  ['touchend', 'click', 'keydown'].forEach((t) => document.addEventListener(t, () => Sound.unlock(), true));
  let keyPressing = false;
  glc.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !keyPressing) {
      e.preventDefault();
      keyPressing = true;
      Sound.unlock();
      pressStart('key', ball.cx + rnd(-0.35, 0.35) * ball.R, ball.cyEff + rnd(-0.35, 0.35) * ball.R);
      setTimeout(() => { pressEnd('key'); keyPressing = false; }, e.key === ' ' ? 420 : 160);
    }
  });

  /* ---------- 고르기 ---------- */
  function applyTheme() {
    const f = cur();
    document.documentElement.style.setProperty('--table', f.bg[1]);
    document.documentElement.style.setProperty('--accent', f.accent);
  }
  function buildChips() {
    chipsEl.textContent = '';
    const list = LISTS[mode];
    list.forEach((f, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.id = 'chip-' + mode + '-' + f.id;
      b.setAttribute('aria-pressed', String(i === idx[mode]));
      const sw = document.createElement('span');
      sw.className = 'swatch';
      const kc = mode === 'keycap', soft = mode !== 'wax' && !kc;
      const c0 = kc ? f.cap : soft ? f.skin : f.shell, c1 = kc ? f.cap2 : soft ? f.cream : f.shell2, c2 = kc ? f.cap : soft ? f.deep : f.shell;
      sw.style.background = 'radial-gradient(circle at 34% 30%, ' + c1 + ' 0 22%, ' + c0 + ' 58%, ' + c2 + ' 100%)';
      b.append(sw, document.createTextNode(f.name));
      b.addEventListener('click', () => setFlavor(i));
      chipsEl.append(b);
    });
    const sel = chipsEl.children[idx[mode]];
    chipsEl.scrollLeft = sel ? Math.max(0, sel.offsetLeft - (chipsEl.clientWidth - sel.offsetWidth) / 2) : 0;
  }
  function resetBall(withSound) {
    for (const d of dents) { d.used = false; d.active = false; d.depth = 0; d.vel = 0; }
    for (const K of KEYS) { K.p = 0; K.flash = 0; K.held = 0; }
    splats.length = 0;
    pointers.clear(); stretch.active = false; spin.hold = false;
    spin.w = [0, 0, 0];
    Object.assign(shape, { a: 1, va: 0, f: 0, vf: 0, flatT: 0, pop: 0.35, vp: 0 });
    perm.length = 0;
    clearMask(); waxDone = false; crushDone = false; cover = { cracked: 0, broken: 0, crushed: 0 };
    randomPose();
    updateStatus();
    if (withSound) Sound.play('pop', { gain: 0.6 });
    forceDraw = true;
  }
  function setFlavor(i) {
    idx[mode] = i;
    store.set('malang_idx_' + mode, String(i));
    [...chipsEl.children].forEach((c, k) => c.setAttribute('aria-pressed', String(k === i)));
    applyTheme();
    resetBall(true);
  }
  function setMode(m) {
    if (m === mode) return;
    mode = m;
    store.set('malang_mode', m);
    tabSquishy.setAttribute('aria-selected', String(m === 'squishy'));
    tabOhaeng.setAttribute('aria-selected', String(m === 'ohaeng'));
    tabWax.setAttribute('aria-selected', String(m === 'wax'));
    tabKeycap.setAttribute('aria-selected', String(m === 'keycap'));
    tabThrow.setAttribute('aria-selected', String(m === 'throw'));
    fixBtn.hidden = m !== 'squishy' && m !== 'ohaeng';
    syncDim();
    buildChips(); applyTheme(); showHint(); resetBall(true);
    resize();
  }
  tabSquishy.addEventListener('click', () => setMode('squishy'));
  tabOhaeng.addEventListener('click', () => setMode('ohaeng'));
  tabWax.addEventListener('click', () => setMode('wax'));
  tabKeycap.addEventListener('click', () => setMode('keycap'));
  tabThrow.addEventListener('click', () => setMode('throw'));
  resetBtn.addEventListener('click', () => resetBall(true));
  function syncSoundBtn() {
    const on = Sound.isOn();
    soundBtn.textContent = on ? '소리 켬' : '소리 끔';
    soundBtn.setAttribute('aria-pressed', String(on));
  }
  soundBtn.addEventListener('click', () => { Sound.setOn(!Sound.isOn()); syncSoundBtn(); });
  function syncDim() {
    dimSeg.hidden = mode !== 'ohaeng';
    dim2.setAttribute('aria-pressed', String(!solid));
    dim3.setAttribute('aria-pressed', String(solid));
  }
  function setSolid(v) {
    if (v === solid) return;
    solid = v; store.set('malang_3d', v ? '1' : '0');
    syncDim(); resetBall(true);
  }
  dim2.addEventListener('click', () => setSolid(false));
  dim3.addEventListener('click', () => setSolid(true));
  function syncFixBtn() { fixBtn.setAttribute('aria-pressed', String(fixOn)); }
  fixBtn.addEventListener('click', () => { fixOn = !fixOn; store.set('malang_fix', fixOn ? '1' : '0'); syncFixBtn(); });

  /* ---------- 매 프레임 ---------- */
  // 배경색이 고른 맛 색으로 천천히 바뀐다
  function fadeColors(dt) {
    const f = cur(), k = Math.min(1, dt * 7);
    let moving = false;
    for (let i = 0; i < 3; i++) {
      const dtop = f.bgRgb[0][i] - colNow.top[i], dbot = f.bgRgb[1][i] - colNow.bot[i];
      colNow.top[i] += dtop * k; colNow.bot[i] += dbot * k;
      if (Math.abs(dtop) + Math.abs(dbot) > 0.002) moving = true;
    }
    return moving;
  }
  function update(dt) {
    if (mode === 'keycap') { updateKeys(dt); return fadeColors(dt); }
    if (mode === 'throw') { updateSplats(dt); return fadeColors(dt); }
    // 굴러가던 관성
    const wl = Math.hypot(spin.w[0], spin.w[1], spin.w[2]);
    if (spin.hold) { const k = Math.exp(-dt * 10); spin.w[0] *= k; spin.w[1] *= k; spin.w[2] *= k; }
    else if (wl > 1e-3) {
      rotO(spin.w[0], spin.w[1], spin.w[2], wl * dt);
      const k = Math.exp(-dt * 1.6); spin.w[0] *= k; spin.w[1] *= k; spin.w[2] *= k;
    }

    // 늘리기
    let aT = 1, stretchRate = 0;
    if (stretch.active) {
      const p = pointers.get(stretch.a), q = pointers.get(stretch.b);
      if (p && q) {
        let x = Math.hypot(q.x - p.x, q.y - p.y) / stretch.d0 - 1;
        x = x / (1 + Math.abs(x) * 1.0);
        const lim = stretchLimit();
        aT = Math.min(1 + clamp(x, -lim * 0.55, lim), (Math.min(W, H) * 0.47) / ball.R);   // 늘려도 화면 밖으로 안 넘치게
        shape.th = Math.atan2(-(q.y - p.y), q.x - p.x);
      } else stretch.active = false;
    }
    const fl = bodyFeel();
    const kA = stretch.active ? 520 : fl.sk, cA = stretch.active ? 40 : fl.sc;
    const aBefore = shape.a;
    shape.va += (kA * (aT - shape.a) - cA * shape.va) * dt;
    shape.a = clamp(shape.a + shape.va * dt, 0.5, 2.0);
    if (stretch.active && (mode !== 'wax' || waxDone)) stretchRate = Math.abs(shape.a - aBefore) / dt;
    if (fl.type === 'foam') shape.flatT *= Math.exp(-dt * fl.recover * 0.45); else shape.flatT = 0;
    shape.vf += (fl.fk * (shape.flatT - shape.f) - fl.fc * shape.vf) * dt;
    shape.f = clamp(shape.f + shape.vf * dt, -0.3, 0.5);
    shape.vp += (300 * (1 - shape.pop) - 17 * shape.vp) * dt;
    shape.pop += shape.vp * dt;
    shapeMatrix();

    // 고정을 끄면 남아 있던 자국이 천천히 돌아온다
    if (!fixOn && perm.length) {
      for (const k of perm) k.depth *= Math.exp(-dt * 1.2);
      for (let i = perm.length - 1; i >= 0; i--) if (perm[i].depth < 0.004) perm.splice(i, 1);
      forceDraw = true;
    }

    // 손가락 자국
    for (const d of dents) {
      if (!d.used) continue;
      if (d.active) {
        d.hold += dt;
        d.grow = Math.min(1, d.grow + dt / 2.5);   // 한 곳을 오래 누를수록 넓고 깊게 찌그러진다
        const tgt = d.max * (1 - Math.exp(-d.hold * 3.2)) * (1 + 0.25 * d.grow) * (stretch.active ? 0.45 : 1);
        d.vel += (520 * (tgt - d.depth) - 42 * d.vel) * dt;
        d.depth += d.vel * dt;
        const k = Math.min(1, dt * 28);
        d.x += (d.tx - d.x) * k; d.y += (d.ty - d.y) * k;
      } else {
        d.rel += dt;
        if (d.feel.type === 'foam') {
          d.vel = 0;
          if (d.rel > d.feel.stick) { d.depth *= Math.exp(-dt * d.feel.recover); d.grow *= Math.exp(-dt * d.feel.recover * 0.6); }
        } else {
          d.grow *= Math.exp(-dt * 6);
          d.vel += (d.feel.k * (0 - d.depth) - d.feel.c * d.vel) * dt;
          d.depth += d.vel * dt;
        }
        if (Math.abs(d.depth) < 0.002 && Math.abs(d.vel) < 0.02) d.used = false;
      }
      d.r = d.r0 * (1 + 0.5 * clamp(d.depth / Math.max(d.max, 0.01), 0, 1)) * (1 + 0.7 * d.grow);
    }

    // 왁스 누르고 있는 동안
    if (mode === 'wax') for (const pt of pointers.values()) if (pt.kind === 'press' && pt.wax) waxHold(pt, dt);

    // 쫘악: 문지르거나 늘리는 만큼 끈적한 알갱이 소리를 촘촘히 튼다 (왁스 다 깬 뒤에는 바스락)
    let stickRate = 0, stickGain = 0;
    for (const pt of pointers.values()) {
      if (pt.kind !== 'press') continue;
      pt.speed *= Math.exp(-dt * 8);
      if (pt.mat && pt.mat.kind === 'soft' && pt.speed > 40) {
        stickRate += Math.min(pt.speed / 30, 45);
        stickGain = Math.max(stickGain, Math.min(0.55, pt.speed / 2000));
      }
    }
    if (stretchRate > 0.05) { stickRate += Math.min(stretchRate * 60, 50); stickGain = Math.max(stickGain, Math.min(0.6, stretchRate * 0.8)); }
    if (stickRate > 0) grains(mode === 'wax' ? 'click' : 'stick', stickRate, stickGain, dt);

    const moving = fadeColors(dt);

    // 왁스 진행도
    const now = performance.now();
    if (mode === 'wax' && coverDirty && now - lastCover > 90) {
      lastCover = now; coverDirty = false;
      computeCover();
      if (!waxDone && cover.broken > 0.7) finishWax();
      if (waxDone && !crushDone && cover.crushed > 0.85) {
        crushDone = true;
        for (let i = 0; i < 3; i++) Sound.play('chunk', { gain: rnd(0.6, 0.85), rate: rnd(0.7, 0.9), delay: i * rnd(0.05, 0.09) });
        Sound.play('chime', { gain: 0.8, delay: 0.3 });
        buzz([14, 40, 14, 40, 24]);
      }
      updateStatus();
    }

    return moving;
  }

  let last = performance.now(), slowFrames = 0, frames = 0;
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
    last = now;
    const colorMoving = update(dt);
    const busy = forceDraw || colorMoving || pointers.size > 0 || dents.some((d) => d.used) ||
      Math.abs(shape.va) + Math.abs(shape.vf) + Math.abs(shape.vp) > 1e-3 ||
      Math.abs(shape.a - 1) > 1e-3 || Math.abs(shape.f - shape.flatT) > 1e-3 || Math.abs(1 - shape.pop) > 1e-3 ||
      Math.hypot(spin.w[0], spin.w[1], spin.w[2]) > 1e-3 || maskDirty;
    if (busy) {
      render();
      forceDraw = false;
      // 느린 기기면 해상도를 조금씩 낮춘다
      frames++;
      if (dt > 0.026) slowFrames++;
      if (frames >= 45) {
        if (slowFrames > 30 && quality > 0.55) { quality -= 0.15; resize(); }
        frames = 0; slowFrames = 0;
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 시작 ---------- */
  const savedMode = store.get('malang_mode');
  if (LISTS[savedMode]) mode = savedMode;
  Object.keys(LISTS).forEach((m) => {
    const v = parseInt(store.get('malang_idx_' + m) || '', 10);
    const list = LISTS[m];
    if (v >= 0 && v < list.length) idx[m] = v;
  });
  tabSquishy.setAttribute('aria-selected', String(mode === 'squishy'));
  tabOhaeng.setAttribute('aria-selected', String(mode === 'ohaeng'));
  tabWax.setAttribute('aria-selected', String(mode === 'wax'));
  tabKeycap.setAttribute('aria-selected', String(mode === 'keycap'));
  tabThrow.setAttribute('aria-selected', String(mode === 'throw'));
  fixBtn.hidden = mode !== 'squishy' && mode !== 'ohaeng';
  syncDim();
  buildChips(); applyTheme(); showHint(); syncSoundBtn(); syncFixBtn();
  {
    const f = cur();
    colNow.top = f.bgRgb[0].slice(); colNow.bot = f.bgRgb[1].slice();
  }
  try { initGL(); } catch (err) {
    $('fallback').hidden = false;
    window.__malangError = String(err && err.message || err);
    console.error(err);
    return;
  }
  glc.addEventListener('webglcontextlost', (e) => { e.preventDefault(); gl = null; });
  glc.addEventListener('webglcontextrestored', () => { try { initGL(); } catch (err) { $('fallback').hidden = false; } });
  resize();
  randomPose();
  shape.pop = 0.4;
  shapeMatrix();
  updateStatus();
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
  requestAnimationFrame((t) => { last = t; frame(t); });
  Sound.prepare();
  window.__waxState = () => ({ done: waxDone, crushDone, cover });
  window.__malangReady = true;
})();
</script>
</body></html>
