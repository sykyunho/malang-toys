:root {

  --night-line: rgba(244, 244, 245, 0.42);
  --brand: #ff1f66;
  --gold: #a8740a;
  --display: "Song Myung", "AppleMyungjo", "Nanum Myeongjo", serif;
  --body: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
html, body { height: 100%; }
body {

  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);

  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; outline: none; }
#fx { pointer-events: none; z-index: 1; }

.top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.55rem; letter-spacing: -0.02em; color: var(--ink); }
.tools { display: flex; gap: 6px; }
.pill {
  font: inherit; font-size: 0.8125rem; font-weight: 600; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px;

.pill[aria-pressed="false"] { color: var(--ink-soft); }
.pill:active, .chip:active, .tab:active, .seg button:active { transform: scale(0.96); }

/* 공덕 수: 이름 아래 가운데. 숫자는 제목과 같은 명조 */
.count {
  position: absolute; left: 0; right: 0; top: 54px; z-index: 2;
  display: flex; flex-direction: column; align-items: center;

}
.count-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em; color: var(--ink-soft); }
.count-num { font-family: var(--display); font-weight: 400; font-size: 2.75rem; line-height: 1.12; color: var(--ink); font-variant-numeric: tabular-nums; }
.count-num.bump { animation: bump 0.22s ease-out; }

.count-sub { font-size: 0.8125rem; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* 알림 한 줄: 칩처럼 어두운 유리 */
.status {
  position: absolute; left: 50%; top: 150px; transform: translateX(-50%); z-index: 3;
  font-size: 0.8125rem; font-weight: 600; color: var(--on-ink);
  background: var(--night); border: 1px solid var(--night-line); border-radius: 999px;

  transition: opacity 0.35s ease;
}
.status.gone { opacity: 0; }

/* 친 자리에서 떠오르는 "공덕 +1" */
.floats { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }

.fallback {

  padding-left: max(16px, env(safe-area-inset-left, 0px));

.dock {

.chip {

.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; }
.seg[hidden] { display: none; }
.seg button {

.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--on-ink); background: rgba(255, 255, 255, 0.1); }

@media (prefers-reduced-motion: reduce) { .hint, .status { transition: none; } .count-num.bump { animation: none; } }
</style>

    if (!mala.grabShown) { mala.grabShown = true; toast('잡았어요 · 빙글 돌려 보세요'); }
    forceDraw = true;
  }
  glc.addEventListener('pointermove', (e) => {
    const dr = mala.drag;
    if (mode !== 'mala' || !dr || dr.id !== e.pointerId) return;
    if (dr.kind === 'pending') {
      const dx0 = e.clientX - dr.x0, dy0 = e.clientY - dr.y0;
      if (Math.hypot(dx0, dy0) < 8) return;
      clearTimeout(mala.holdTimer);
      mala.target = null;
      dr.x = dr.x0; dr.y = dr.y0;
      // 옆으로 먼저 움직이거나, 고리 왼쪽 절반(엄지 자리 반대편)에서 시작하면 돌리기.
      // 왼쪽에선 아래로 내리는 게 고리를 거꾸로 도는 방향이라 쓸기로 받으면 알이 반대로 간다
      const fr0 = ringFrame(), nx0 = (dr.x0 - fr0.cx) / fr0.rx;
      if (Math.abs(dx0) > Math.abs(dy0) * 0.8 || nx0 < -0.35) startTurn(dr, 'turn');
      else { dr.kind = 'pull'; dr.start = Math.round(mala.p); dr.hx = 0; dr.vy = 0; mala.rigWant = 0; }   // 곧게 내리면 쓸기
    }
    if (dr.kind === 'pull') {
      const dy = e.clientY - dr.y, dx = e.clientX - dr.x;
      dr.hx += Math.abs(dx); dr.vy += Math.abs(dy);
      // 쓸다가 손가락이 곡선을 그리면 돌리기로 바꾼다 (세로만 보면 원을 그릴 때 알이 왔다 갔다 한다)
      if (dr.hx > 22 && dr.hx > dr.vy * 0.5) startTurn(dr, 'turn');
      else {
        dr.moved += Math.abs(dy);
        if (malaFree) moveBy(dy / dr.ppu);
        else moveBy(dy / dr.ppu, dr.start - 1, dr.start + 1);   // 한 번 쓸 때 한 알까지만
      }
    }
    if (dr.kind === 'turn' || dr.kind === 'grab') {
      // 고리 가운데를 도는 각도만큼 실이 돈다 (가운데 가까이선 각도가 튀니 덜 반영)
      const ra = ringAngle(dr.fr, e.clientX, e.clientY);
      let da = ra.a - dr.ang;
      if (da > Math.PI) da -= 2 * Math.PI;
      if (da < -Math.PI) da += 2 * Math.PI;
      dr.ang = ra.a;
      const w = clamp((ra.r - 0.15) / 0.3, 0, 1);
      dr.moved += Math.abs(da);
      moveBy(da * RR * w);
    }
    dr.x = e.clientX; dr.y = e.clientY;
    const now = e.timeStamp || performance.now();
    mala.samples.push({ t: now, p: mala.p });
    while (mala.samples.length > 2 && now - mala.samples[0].t > 90) mala.samples.shift();
    forceDraw = true;
  });
  function endDrag(e) {
    if (mode === 'moktak') { stopAuto(); return; }
    const dr = mala.drag;
    if (!dr || dr.id !== e.pointerId) return;
    clearTimeout(mala.holdTimer);
    mala.drag = null;
    mala.rigWant = null;
    const now = e.timeStamp || performance.now(), s0 = mala.samples[0];
    const v = s0 && now - s0.t > 8 ? (mala.p - s0.p) / ((now - s0.t) / 1000) : 0;
    window.__mokFling = { v, kind: dr.kind, dt: s0 ? now - s0.t : 0, n: mala.samples.length, moved: dr.moved };
    if (dr.kind === 'pending') {
      // 톡: 한 알씩이면 한 알, 굴리기면 살짝 굴린다
      if (malaFree) { mala.target = null; mala.v = 7; } else mala.target = Math.round(mala.p) + 1;
    } else if (dr.kind === 'grab' || dr.kind === 'turn') {
      if (malaFree && Math.abs(v) >= 1.4) { mala.target = null; mala.v = clamp(v, -28, 28); }
      else mala.target = v > 2 ? Math.ceil(mala.p) : v < -2 ? Math.floor(mala.p) : Math.round(mala.p);
    } else if (malaFree) {
      mala.v = clamp(v, -28, 28);
      if (Math.abs(mala.v) < 1.4) { mala.v = 0; mala.target = Math.round(mala.p); }
    } else {
      const d = mala.p - dr.start;
      if (d >= 0) mala.target = d >= aOf(dr.start) * 0.55 || v > 2.5 ? dr.start + 1 : dr.start;
      else mala.target = -d >= (1 - aOf(dr.start - 1)) * 0.55 || v < -2.5 ? dr.start - 1 : dr.start;
    }
    forceDraw = true;
  }
  glc.addEventListener('pointerup', endDrag);
  glc.addEventListener('pointercancel', endDrag);
  glc.addEventListener('lostpointercapture', (e) => { if (mala.drag && mala.drag.id === e.pointerId) endDrag(e); });
  glc.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (mode === 'moktak' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); Sound.unlock(); strike(null, null, false); }
    if (mode === 'mala' && (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault(); Sound.unlock();
      const base = mala.target != null ? mala.target : Math.round(mala.p);
      mala.v = 0; mala.target = base + (e.key === 'ArrowUp' ? -1 : 1);
    }
  });

  /* ---------- 고르기 ---------- */
  function buildChips() {
    chipsEl.innerHTML = '';
    const key = listKey(mode), list = LISTS[key];
    list.forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', String(i === skin[key]));
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = s.swCss || 'radial-gradient(circle at 35% 30%, ' + s.sw[0] + ', ' + s.sw[1] + ')';
      b.appendChild(sw);
      b.appendChild(document.createTextNode(s.name));
      b.addEventListener('click', () => {
        skin[key] = i; store.set('mokyeom_skin_' + key, String(i));
        [...chipsEl.children].forEach((c, j) => c.setAttribute('aria-pressed', String(j === i)));
        Sound.unlock();
        if (s.desc) toast(s.desc);
        if (mode === 'moktak') strike(null, null, true);
        else { mala.v = 0; mala.target = Math.round(mala.p) + 1; }
        forceDraw = true;
      });
      chipsEl.appendChild(b);
    });
  }
  function setMode(m) {
    if (mode === m) return;
    stopAuto();
    clearTimeout(mala.holdTimer); mala.drag = null;
    mode = m; store.set('mokyeom_mode', m);
    tabMok.setAttribute('aria-selected', String(m === 'moktak'));
    tabMala.setAttribute('aria-selected', String(m === 'mala'));
    segEl.hidden = m !== 'mala';
    glc.setAttribute('aria-label', m === 'moktak' ? '목탁. 누르면 똑 소리가 나요. 키보드에서는 스페이스로 쳐요.' : '염주. 아래로 쓸면 한 알씩 넘어가고, 꾹 눌러 잡은 채 빙글 돌리면 고리가 돌아요. 키보드에서는 아래 화살표로 넘겨요.');
    buildChips(); showHint(); syncCount(false); syncSeg();
    placeCamera();
    forceDraw = true;
  }
  function syncSeg() {
    segCalm.setAttribute('aria-pressed', String(!malaFree));
    segFree.setAttribute('aria-pressed', String(malaFree));
    setBasic.setAttribute('aria-pressed', String(!five[mode]));
    setFive.setAttribute('aria-pressed', String(five[mode]));
  }
  function setFiveOn(v) {
    if (five[mode] === v) return;
    five[mode] = v; store.set('mokyeom_five_' + mode, v ? '1' : '0');
    syncSeg(); buildChips();
    const s = curOf(mode);
    if (v) toast(s.desc || '오행 — 木火土金水');
    forceDraw = true;
  }
  const setBasic = $('setBasic'), setFive = $('setFive');
  setBasic.addEventListener('click', () => setFiveOn(false));
  setFive.addEventListener('click', () => setFiveOn(true));
  tabMok.addEventListener('click', () => setMode('moktak'));
  tabMala.addEventListener('click', () => setMode('mala'));
  segCalm.addEventListener('click', () => { malaFree = false; store.set('mokyeom_mala_free', '0'); mala.v = 0; mala.target = Math.round(mala.p); syncSeg(); showHint(); });
  segFree.addEventListener('click', () => { malaFree = true; store.set('mokyeom_mala_free', '1'); syncSeg(); showHint(); });
  function syncSoundBtn() { const on = Sound.isOn(); soundBtn.setAttribute('aria-pressed', String(on)); soundBtn.textContent = on ? '소리 켬' : '소리 끔'; }
  soundBtn.addEventListener('click', () => { Sound.unlock(); Sound.setOn(!Sound.isOn()); syncSoundBtn(); });
  resetBtn.addEventListener('click', () => {
    if (mode === 'moktak') { mokCount = 0; store.set('mokyeom_moktak_count', '0'); }
    else { mala.p = 0; mala.v = 0; mala.target = null; mala.rig = 0; spinBase.fill(0); store.set('mokyeom_mala_p', '0'); }
    syncCount(true);
    forceDraw = true;
  });

  /* ---------- 돌리기 ---------- */
  let last = 0, frames = 0, slowFrames = 0;
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
    last = now;
    const busy = (mode === 'moktak' ? updateMok(dt) : updateMala(dt)) || forceDraw;
    updateFx(dt);
    if (busy) {
      render();
      forceDraw = false;
      frames++;
      if (dt > 0.026) slowFrames++;
      if (frames >= 45) {
        if (slowFrames > 30 && quality > 0.55) { quality -= 0.15; resize(); }
        frames = 0; slowFrames = 0;
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 시작 ---------- */
  tabMok.setAttribute('aria-selected', String(mode === 'moktak'));
  tabMala.setAttribute('aria-selected', String(mode === 'mala'));
  segEl.hidden = mode !== 'mala';
  syncSeg(); syncSoundBtn(); buildChips(); showHint(); syncCount(false);
  try { initGL(); } catch (err) {
    $('fallback').hidden = false;
    window.__mokError = String(err && err.message || err);
    console.error(err);
    return;
  }
  glc.addEventListener('webglcontextlost', (e) => { e.preventDefault(); gl = null; });
  glc.addEventListener('webglcontextrestored', () => { try { initGL(); } catch (err) { $('fallback').hidden = false; } });
  layout(mala.p);
  { const g = ringPt(sPos[0]); mala.tasD = norm(add(add(mul(norm(g), 0.75), [0, -0.85, 0]), [0, 0, 0.35])); }
  resize();
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
  requestAnimationFrame((t) => { last = t; frame(t); });
  Sound.prepare();
  // 점검용: 그리기 한 장에 드는 시간
  window.__mokBench = (n) => { const t0 = performance.now(); for (let i = 0; i < n; i++) { render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); } return (performance.now() - t0) / n; };
  window.__mokPose = (sq, d) => { mokState.sq = sq; mokState.dent = d; dent.pt = DEFAULT_HIT; render(); };
  window.__mokState = () => ({ mode, p: mala.p, count: mode === 'moktak' ? mokCount : beadsOf(clacked(mala.p)), sq: mokState.sq });
  window.__mokReady = true;
})();
</script>
</body></html>
